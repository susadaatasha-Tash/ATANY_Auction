services:
  - type: web
    name: atany-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app
